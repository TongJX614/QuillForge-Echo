<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrative Core · 示例播放器</title>
<style>
  :root{
    --bg:#05080e;
    --panel:#0a111b;
    --panel-2:#0d1724;
    --line:rgba(124,168,196,.18);
    --line-strong:rgba(124,168,196,.34);
    --text:#d9e6f2;
    --muted:#7d93a8;
    --accent:#5fe3c0;
    --accent-soft:rgba(95,227,192,.12);
    --amber:#f0b35a;
    --amber-soft:rgba(240,179,90,.12);
    --danger:#ff6b8a;
    --font-body:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(95,227,192,.08), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(90,130,255,.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(124,168,196,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,168,196,.045) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.8), transparent 80%);
  }
  .topbar{
    position:relative;
    display:flex;
    align-items:center;
    gap:24px;
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    background:rgba(5,8,14,.72);
    backdrop-filter:blur(12px);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:6px;
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:2.5px;
    color:var(--accent);
    white-space:nowrap;
  }
  .brand span{color:var(--text)}
  .brand em{color:var(--muted);font-style:normal;font-size:10px;letter-spacing:1px}
  .project-head{min-width:0;flex:1}
  .project-head h1{
    margin:0;
    font-size:18px;
    font-weight:600;
    letter-spacing:.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .project-meta{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px}
  .progress{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    padding:7px 12px;
    background:var(--panel);
    white-space:nowrap;
  }
  .progress strong{color:var(--amber);font-weight:500}
  .layout{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(320px,380px);
    gap:22px;
    max-width:1380px;
    margin:0 auto;
    padding:24px 28px 40px;
    align-items:start;
  }
  .stage{
    min-height:620px;
    display:flex;
    flex-direction:column;
    border:1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(95,227,192,.035), transparent 30%),
      var(--panel);
    padding:30px 34px 34px;
    position:relative;
    overflow:hidden;
  }
  .stage::before{
    content:"";
    position:absolute;
    inset:0 auto auto 0;
    width:70%;
    height:1px;
    background:linear-gradient(90deg, var(--accent), transparent);
    opacity:.55;
  }
  .scene-meta{
    display:flex;
    gap:14px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .scene-meta span:last-child{color:var(--accent)}
  .stage h2{
    margin:14px 0 6px;
    font-size:28px;
    letter-spacing:1px;
    font-weight:600;
  }
  .scene-description{
    margin:0 0 24px;
    color:var(--muted);
    font-size:13px;
    line-height:1.9;
    max-width:70ch;
  }
  .dialogue{
    position:relative;
    border-left:2px solid var(--accent);
    background:linear-gradient(90deg, var(--accent-soft), transparent 70%);
    padding:20px 22px 20px 24px;
    margin-top:6px;
  }
  .scene-visual{
    position:relative;
    flex:1;
    min-height:150px;
    margin:18px 0 24px;
    border:1px solid var(--line);
    overflow:hidden;
    background:
      linear-gradient(135deg, rgba(95,227,192,.09), transparent 45%),
      radial-gradient(620px 220px at 82% 0%, rgba(90,130,255,.13), transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(124,168,196,.035) 2px 3px);
  }
  .scene-visual::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(95,227,192,.22), transparent);
    transform:translateX(-100%);
    animation:scan 7s linear infinite;
  }
  @keyframes scan{to{transform:translateX(100%)}}
  .scene-visual-label{
    position:absolute;
    left:18px;
    top:15px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:3px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .scene-number{
    position:absolute;
    right:18px;
    bottom:6px;
    font-family:var(--font-mono);
    font-size:56px;
    line-height:1;
    font-weight:600;
    color:rgba(95,227,192,.16);
    letter-spacing:2px;
  }
  .speaker{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:12px;
    text-transform:uppercase;
  }
  .line{
    margin:0;
    font-size:17px;
    line-height:2;
    letter-spacing:.2px;
    color:#eaf6ff;
    min-height:3.2em;
  }
  .advance{
    margin-top:18px;
    align-self:flex-start;
    border:1px solid var(--line-strong);
    background:var(--panel-2);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:1px;
    padding:9px 18px;
    cursor:pointer;
    transition:border-color .18s, background .18s, color .18s;
  }
  .advance:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:26px}
  .choice{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) auto;
    gap:12px;
    align-items:center;
    text-align:left;
    width:100%;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:14px 16px;
    cursor:pointer;
    font-family:inherit;
    transition:border-color .18s, background .18s, transform .18s;
  }
  .choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateX(2px)}
  .choice:disabled{cursor:not-allowed;opacity:.42}
  .choice-index{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
  .choice-body{display:flex;flex-direction:column;gap:4px;min-width:0}
  .choice-body strong{font-size:14px;font-weight:600}
  .choice-body small{font-size:11px;color:var(--muted);line-height:1.6}
  .choice-state{font-family:var(--font-mono);font-size:10px;color:var(--amber);white-space:nowrap}
  .choice.blocked .choice-index{color:var(--muted)}
  .ending{
    margin-top:auto;
    border:1px solid rgba(240,179,90,.45);
    background:
      radial-gradient(400px 200px at 0% 0%, var(--amber-soft), transparent 70%),
      var(--panel-2);
    padding:30px;
  }
  .ending-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:4px;color:var(--amber)}
  .ending h2{margin:12px 0 14px;font-size:30px;color:#ffe3b0;letter-spacing:2px}
  .ending p{margin:0 0 24px;font-size:15px;line-height:2;color:#f0e0c8;max-width:60ch}
  .ending button,.actions button{
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:1px;
    padding:8px 15px;
    cursor:pointer;
    transition:border-color .18s,color .18s,background .18s;
  }
  .ending button:hover,.actions button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .actions button:disabled{opacity:.35;cursor:not-allowed}
  .console{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
  .panel{border:1px solid var(--line);background:rgba(10,17,27,.82);padding:16px}
  .panel-title{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:3px;
    color:var(--muted);
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .panel-title::after{content:"";height:1px;flex:1;background:var(--line);margin-left:12px}
  .state-row{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px dashed rgba(124,168,196,.1)}
  .state-row:last-child{border-bottom:0}
  .state-label{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:1px;padding-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    display:inline-flex;
    align-items:baseline;
    gap:4px;
    border:1px solid var(--line);
    background:rgba(95,227,192,.06);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:10px;
    padding:3px 7px;
    line-height:1.5;
  }
  .chip em{font-style:normal;color:var(--accent)}
  .chip.amber{background:rgba(240,179,90,.08);border-color:rgba(240,179,90,.25)}
  .chip.amber em{color:var(--amber)}
  .empty{font-family:var(--font-mono);font-size:10px;color:#42566a}
  .grow{min-height:0;flex:1;display:flex;flex-direction:column}
  .log{
    list-style:none;
    margin:0;
    padding:0;
    overflow:auto;
    max-height:220px;
    display:flex;
    flex-direction:column;
    gap:6px;
    font-family:var(--font-mono);
    font-size:10px;
    line-height:1.6;
    color:var(--muted);
  }
  .log li{display:flex;gap:8px;border-left:1px solid var(--line);padding-left:8px}
  .log .seq{color:#42566a;min-width:26px}
  .log .type{color:var(--accent);white-space:nowrap}
  .log .type.error{color:var(--danger)}
  .log .type.ending{color:var(--amber)}
  .actions{display:flex;gap:8px}
  .actions button{flex:1}
  .save-status{font-family:var(--font-mono);font-size:10px;color:var(--muted);min-height:14px;text-align:right}
  .error{
    margin-top:18px;
    border:1px solid rgba(255,107,138,.45);
    background:rgba(255,107,138,.08);
    color:#ffb3c3;
    padding:12px 14px;
    font-family:var(--font-mono);
    font-size:11px;
    line-height:1.7;
    white-space:pre-wrap;
  }
  .fatal{
    max-width:760px;
    margin:80px auto;
    border:1px solid rgba(255,107,138,.45);
    background:var(--panel);
    padding:30px;
  }
  .fatal h1{font-size:20px;margin:0 0 14px;color:#ffb3c3}
  .fatal pre{white-space:pre-wrap;color:var(--muted);font-family:var(--font-mono);font-size:11px;line-height:1.8}
  @media (max-width:980px){
    .layout{grid-template-columns:1fr;padding:18px}
    .console{position:static}
    .stage{min-height:auto;padding:22px}
    .topbar{padding:14px 18px;gap:14px}
    .project-head h1{font-size:16px}
    .progress{display:none}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">NARRATIVE <span>CORE</span> <em>v0.1</em></div>
  <div class="project-head">
    <h1 id="project-title">正在加载项目…</h1>
    <div class="project-meta" id="project-meta"></div>
  </div>
  <div class="progress">结局 <strong id="ending-count">0 / 0</strong></div>
</header>

<main class="layout">
  <section class="stage" aria-live="polite">
    <div class="scene-meta">
      <span id="scene-location">—</span>
      <span id="scene-time"></span>
    </div>
    <h2 id="scene-name">—</h2>
    <p class="scene-description" id="scene-description"></p>

    <div class="scene-visual" id="scene-visual">
      <span class="scene-visual-label" id="scene-visual-label">SCENE</span>
      <strong class="scene-number" id="scene-number">01 / 03</strong>
    </div>

    <div class="dialogue" id="dialogue-card" hidden>
      <div class="speaker" id="speaker-name"></div>
      <p class="line" id="dialogue-text"></p>
      <button class="advance" id="advance-btn" type="button">继续 ▸</button>
    </div>

    <div class="choices" id="choices"></div>

    <div class="ending" id="ending-card" hidden>
      <div class="ending-kicker">ENDING</div>
      <h2 id="ending-title"></h2>
      <p id="ending-text"></p>
      <button id="restart-ending" type="button">重新开始</button>
    </div>

    <div class="error" id="error-panel" hidden></div>
  </section>

  <aside class="console">
    <div class="panel">
      <div class="panel-title">RUNTIME STATE</div>
      <div class="state-row"><span class="state-label">阶段</span><div class="chips" id="state-stage"></div></div>
      <div class="state-row"><span class="state-label">FLAGS</span><div class="chips" id="state-flags"></div></div>
      <div class="state-row"><span class="state-label">STATS</span><div class="chips" id="state-stats"></div></div>
      <div class="state-row"><span class="state-label">关系</span><div class="chips" id="state-relationships"></div></div>
      <div class="state-row"><span class="state-label">背包</span><div class="chips" id="state-inventory"></div></div>
      <div class="state-row"><span class="state-label">任务</span><div class="chips" id="state-quests"></div></div>
      <div class="state-row"><span class="state-label">到访</span><div class="chips" id="state-visited"></div></div>
    </div>

    <div class="panel grow">
      <div class="panel-title">EVENT LOG</div>
      <ol class="log" id="event-log"></ol>
    </div>

    <div class="actions">
      <button id="save-btn" type="button">保存</button>
      <button id="load-btn" type="button">读取</button>
      <button id="restart-btn" type="button">重开</button>
    </div>
    <div class="save-status" id="save-status"></div>
  </aside>
</main>

<script type="module" src="./public/app.js"></script>
</body>
</html>
