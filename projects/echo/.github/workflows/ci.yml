name: ci
on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/repository-checks.test.mjs tests/content-checks.test.mjs tests/public-docs.test.mjs
      - run: node scripts/check-repository.mjs
      - run: node scripts/check-content-manifest.mjs

  echo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/echo test
      - run: pnpm --dir apps/echo run validate
      - run: pnpm --dir apps/echo run build
