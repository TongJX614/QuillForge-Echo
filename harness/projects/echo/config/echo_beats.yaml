# ============================================================
# ECHO 宿主节拍注册表
# ============================================================
# 引擎管内容、ECHO 管进度。本表把 ECHO 的 (scene, trigger, stage) 映射到
# 引擎双剧本包的世界书/角色/节拍，并定义主线骨架（选项 + 动作 + 属性变化）。
# 对白文本由 Harness 按世界书实时生成；未注册的触发器走自由生成。
#
# 选项的 actions 是 ECHO NarrativeAction（flag.set / quest.activate / stage.set …），
# 引擎会自动追加 flag.set:echo_choice:<beat>:<choice_id> 用于回写分支与累计 stats。
# stats 键与索尔维剧本包结局系统对齐（copenhagen_affinity / realism_affinity /
# independence / wisdom / empathy / lorentz好感度 / einstein好感度 / de_broglie好感度）。

packs:
  frame: "samples/回响-DEMO"
  solvay: "samples/索尔维/索尔维0801"

# ── 角色对齐：echo_id → 剧本包角色 ──
characters:
  su_ran:        { pack: frame,  pack_id: su_ran,      name: "苏然", aliases: ["你", "玩家"] }
  lin_xiao:      { pack: frame,  pack_id: lin_xiao,    name: "林晓" }
  du_weiming:    { pack: frame,  pack_id: du_weiming,  name: "杜维明", aliases: ["杜未明"] }
  astro_scientist: { pack: frame, pack_id: astro_scientist, name: "研究员", aliases: ["天体物理研究员"] }
  astro_scientist_back: { pack: frame, pack_id: astro_scientist, name: "实验室研究员" }
  astro_scientist_side: { pack: frame, pack_id: astro_scientist, name: "天体物理实验室研究员" }
  researcher:    { pack: frame,  pack_id: researcher,  name: "研究员", aliases: ["VR研究员"] }
  solvay_einstein:    { pack: solvay, pack_id: einstein,    name: "阿尔伯特·爱因斯坦", aliases: ["爱因斯坦"] }
  solvay_bohr:        { pack: solvay, pack_id: bohr,        name: "尼尔斯·玻尔", aliases: ["玻尔"] }
  solvay_heisenberg:  { pack: solvay, pack_id: heisenberg,  name: "维尔纳·海森堡", aliases: ["海森堡"] }
  solvay_schrodinger: { pack: solvay, pack_id: schrodinger, name: "埃尔温·薛定谔", aliases: ["薛定谔"] }
  solvay_pauli:       { pack: solvay, pack_id: pauli,       name: "沃尔夫冈·泡利", aliases: ["泡利"] }
  solvay_curie:       { pack: solvay, pack_id: curie,       name: "玛丽·居里", aliases: ["居里夫人", "居里"] }
  solvay_lorentz:     { pack: solvay, pack_id: lorentz,     name: "亨德里克·洛伦兹", aliases: ["洛伦兹"] }
  solvay_de_broglie:  { pack: solvay, pack_id: de_broglie,  name: "路易·德布罗意", aliases: ["德布罗意"] }
  solvay_born:        { pack: solvay, pack_id: born,        name: "马克斯·玻恩", aliases: ["玻恩", "波恩"] }

# ── 主线节拍 ──
beats:
  # ===== 框架世界：记忆修复暗线 =====
  - id: dlg_office_xiao
    scene: office
    trigger: lin_xiao
    stage: prep
    pack: frame
    title: "匿名委托"
    atmosphere: "深夜工坊，霓虹与仪器微光，压抑不安"
    characters: [su_ran, lin_xiao]
    prompt: "面对这封可疑的匿名委托，你的决定是"
    description: |
      林晓带来一封匿名委托邮件：修复一段来自织女号空间站的损坏记忆数据，
      损坏率87%，报酬异常丰厚，条件是不备份、不外传。苏然直觉这背后有隐情。
      对白应体现林晓的担忧与苏然的理性好奇，自然推进到接受或调查的抉择。
    choices:
      - id: accept
        text: "接受委托，开始修复"
        actions: [{ type: flag.set, flag: mission_accepted }]
        stats: { curiosity: 5 }
        outcome: "你将神经接口连接到工作台，一段破碎的记忆洪流涌入意识……"
        outcome_speaker: narrator
      - id: investigate
        text: "太可疑了，先调查发件人"
        actions: [{ type: flag.set, flag: investigate_sender }]
        stats: { independence: 5 }
        outcome: "林晓追踪加密层，IP 路由指向新深圳织星塔附近——织星科技。"
        outcome_speaker: lin_xiao

  - id: dlg_office_repair_brief
    scene: office
    trigger: lin_xiao
    stage: prep
    pack: frame
    title: "被剪掉的记忆"
    atmosphere: "工作台的指示灯陆续亮起，记忆碎片在读取槽里发出轻微蜂鸣"
    characters: [su_ran, lin_xiao]
    prompt: "林晓说明了修复方案，你的决定是"
    description: |
      记忆碎片和神经接口都已找齐。林晓发现碎片不是自然损坏，缺失段被切得很整齐；
      修复必须把两样东西一起接到办公室工作台。她提醒苏然，这段记忆可能与织女号事故
      以及苏然自己被删除的过去有关。对白保持悬疑克制，推进到开始修复的决定。
    choices:
      - id: start
        text: "现在开始修复"
        actions: [{ type: flag.set, flag: mr_brief_done }]
        stats: { curiosity: 4, independence: 2 }
        outcome: "林晓把工作台预热到待接入状态。"
        outcome_speaker: lin_xiao
      - id: check
        text: "先检查一遍工作台"
        actions: [{ type: flag.set, flag: mr_brief_done }]
        stats: { wisdom: 3 }
        outcome: "你检查了接口触点，确认没有残留电荷。"
        outcome_speaker: su_ran

  - id: dlg_office_repair
    scene: office
    trigger: memory_repair_console
    stage: prep
    pack: frame
    title: "记忆修复"
    atmosphere: "工作台低鸣，神经接口的触点亮起冷光"
    characters: [su_ran, lin_xiao]
    minigame: connect
    prompt: "记忆碎片已经拼合，是否接入神经接口继续修复"
    description: |
      苏然把记忆碎片和神经接口接到工作台，林晓在旁监控底层协议。碎片拼合后，
      意识边缘闪过织女号白色走廊和被剪断的编号。继续同步接口会有神经刺痛，
      但这是恢复缺失读取层的唯一办法。对白应体现修复过程的紧张与记忆闪回。
    choices:
      - id: connect
        text: "接入神经接口，继续修复"
        actions:
          - { type: inventory.remove, itemId: memory_data, count: 1 }
          - { type: inventory.remove, itemId: neural_interface, count: 1 }
          - { type: flag.set, flag: memory_repair_done }
        stats: { curiosity: 4, wisdom: 2 }
        outcome: "记忆载波写入便携终端；数据还缺最后一层时间校准。"
        outcome_speaker: lin_xiao

  - id: dlg_office_repair_locked
    scene: office
    trigger: memory_repair_console
    pack: frame
    title: "未解锁的工作台"
    atmosphere: "工作台的接口锁着，指示灯缓慢呼吸"
    characters: [su_ran]
    prompt: "工作台还没有解锁"
    description: |
      工作台缺少林晓的底层协议授权，现在还无法接入记忆碎片。
      提示苏然先找林晓确认修复方案。
    choices:
      - id: ok
        text: "先去问林晓"
        outcome: "你转身去找林晓。"
        outcome_speaker: narrator

  - id: dlg_office_repair_done
    scene: office
    trigger: memory_repair_console
    pack: frame
    title: "工作台已冷却"
    atmosphere: "工作台的指示灯已经熄灭，只剩下散热风扇的低鸣"
    characters: [su_ran]
    prompt: "工作台已经完成修复"
    description: |
      记忆载波已经写入便携终端，工作台空闲。提示苏然去天文实验室做时间校准。
    choices:
      - id: ok
        text: "离开工作台"
        outcome: "你带着便携终端离开工作台。"
        outcome_speaker: narrator

  - id: dlg_astro_memory_check
    scene: astro
    trigger: astro_scientist
    pack: frame
    title: "记忆时间校准"
    atmosphere: "LISA 观测台，干涉记录在冷白屏幕上缓慢滚动"
    characters: [su_ran, astro_scientist]
    minigame: signal
    prompt: "用 LISA 干涉记录校准记忆载波"
    description: |
      苏然带着修复后的记忆载波来到天文实验室，请研究员借用 LISA 干涉记录做时间基准。
      载波与干涉条纹对齐后，时间戳指向织女号退役当天——这段记忆可能属于苏然自己。
      研究员建议去 VR 回溯实验室做完整重建。对白应克制、专业，保留悬疑感。
    choices:
      - id: go_vr
        text: "去 VR 实验室，把剩下的记忆拼完"
        actions: [{ type: flag.set, flag: memory_check_done }]
        stats: { curiosity: 3, wisdom: 2 }
        outcome: "你把对齐后的载波写进便携终端。"
        outcome_speaker: narrator

  - id: dlg_vr_memory_repair
    scene: vr
    trigger: memory_repair_vr
    pack: frame
    title: "完整记忆重建"
    atmosphere: "白色的记忆空间在 VR 舱内展开，走廊尽头有模糊的人影"
    characters: [su_ran, lin_xiao]
    minigame: find-clue
    prompt: "在记忆空间里寻找被抹掉的细节"
    description: |
      记忆重建终端接入 VR 装置，苏然回到织女号的白色走廊，看到被删除前的自己
      把一枚存储芯片藏进实验服。芯片编号指向十二名死者。记忆最后一层校验指向
      1927 年索尔维会议——匿名委托真正想让她看的地方。对白应紧张、克制，
      允许林晓通过通讯介入提醒时间戳漂移。
    choices:
      - id: exit
        text: "记住这一切，退出记忆空间"
        actions: [{ type: flag.set, flag: memory_fully_repaired }]
        stats: { independence: 5, curiosity: 3 }
        outcome: "记忆空间碎裂成光点，你带着完整的记忆回到现实。"
        outcome_speaker: narrator

  - id: dlg_vr_memory_locked
    scene: vr
    trigger: memory_repair_vr
    pack: frame
    title: "缺少时间基准"
    atmosphere: "记忆重建终端闪烁着待校准的黄色指示灯"
    characters: [su_ran]
    prompt: "记忆重建终端尚未校准"
    description: |
      记忆重建终端缺少天文实验室的时间基准，无法开始完整重建。
      提示苏然先去天文实验室完成校准。
    choices:
      - id: ok
        text: "先去天文实验室"
        outcome: "你记下提示，准备返回天文实验室。"
        outcome_speaker: narrator

  - id: dlg_vr_memory_done
    scene: vr
    trigger: memory_repair_vr
    pack: frame
    title: "记忆已归档"
    atmosphere: "记忆重建终端的指示灯转为稳定的冷蓝"
    characters: [su_ran]
    prompt: "完整记忆已经归档"
    description: |
      完整的记忆已经留在苏然的意识里，无法再被删除。终端进入待机状态。
    choices:
      - id: ok
        text: "离开终端"
        outcome: "你离开记忆重建终端。"
        outcome_speaker: narrator

  - id: dlg_astro_scientist
    scene: astro
    trigger: astro_scientist
    pack: frame
    title: "引力波探测器导览"
    atmosphere: "天文观测实验室，激光干涉仪低鸣，真空管路泛着冷光"
    characters: [su_ran, astro_scientist]
    prompt: "研究员向你介绍引力波探测器，你回应"
    description: |
      玩家受任务指引来到天文观测实验室，参观引力波探测器。主研究员温和热忱，
      用激光干涉、时空涟漪、LIGO 与 LISA 等概念讲解探测器如何测量比原子还小的空间伸缩。
      对白只围绕探测器与引力波展开，不要提及遗失的书籍或其他研究员的委托。
    choices:
      - id: ask_wave
        text: "引力波到底是什么？"
        stats: { curiosity: 5, wisdom: 3 }
        outcome: "研究员从爱因斯坦的预言讲起，说到 2015 年 LIGO 第一次听到黑洞合并的回响。"
        outcome_speaker: astro_scientist
      - id: ask_detector
        text: "这台探测器怎么工作？"
        stats: { wisdom: 5 }
        outcome: "研究员指着两条垂直的长臂：「引力波经过时，一条被拉长，另一条被压缩——我们要量出这点差别。」"
        outcome_speaker: astro_scientist

  - id: dlg_astro_lisa
    scene: astro
    trigger: astro_scientist_side
    pack: frame
    title: "LISA 光谱校准"
    atmosphere: "LISA 观测台，激光干涉仪低鸣，控制台亮着冷白的光"
    characters: [su_ran, astro_scientist_side]
    excludes_flags: [lisa_calibration_done]
    prompt: "研究员请你帮忙取校准底片，你回应"
    description: |
      侧面研究员正在为 LISA 观测台做光谱校准，需要一张留在观测台控制台上的光谱校准底片。
      他请你去取回来，并提醒不要移动其他正在运行的镜组。对白只围绕校准底片和 LISA 观测台。
    choices:
      - id: fetch_spectrum
        text: "我去观测台取底片"
        stats: { curiosity: 3, wisdom: 2 }
        outcome: "研究员点点头，把观测台控制台的位置指给你。"
        outcome_speaker: astro_scientist_side
      - id: ask_lisa
        text: "先讲讲 LISA 在校准什么"
        stats: { curiosity: 5 }
        outcome: "研究员简要解释了激光干涉臂和皮米级测量。"
        outcome_speaker: astro_scientist_side

  - id: dlg_astro_lisa_done
    scene: astro
    trigger: astro_scientist_side
    pack: frame
    title: "校准完成之后"
    atmosphere: "LISA 观测台恢复平稳，控制台读数归位"
    characters: [su_ran, astro_scientist_side]
    requires_flags: [lisa_calibration_done]
    prompt: "校准已完成，你和研究员聊观测台的近况"
    description: |
      光谱校准底片已经交到侧面研究员手上，LISA 观测台重新进入稳定运行。
      研究员对苏然表示感谢，可以聊观测台的数据、隔离区样本或接下来的调查。
      不要再向苏然索要底片，也不要重复派发校准任务。
    choices:
      - id: ask_result
        text: "校准结果怎么样"
        stats: { curiosity: 2 }
        outcome: "研究员说干涉条纹已经对齐，读数回到正常范围。"
        outcome_speaker: astro_scientist_side
      - id: say_goodbye
        text: "那我先走了"
        outcome: "研究员点头，目送你离开观测台。"
        outcome_speaker: astro_scientist_side

  - id: dlg_astro_book
    scene: astro
    trigger: astro_scientist_back
    pack: frame
    title: "遗失的《天体运行论》"
    atmosphere: "天文观测实验室，隔离区门前，研究员神色焦急"
    characters: [su_ran, astro_scientist_back]
    prompt: "研究员请你帮忙找书，你回应"
    description: |
      研究员把一本哥白尼《天体运行论》（De Revolutionibus Orbium Coelestium）忘在了隔离区里，
      但他没有四级门禁卡，进不去。他请你先去阿皮斯实验室找到门禁卡，再回隔离区东侧书架取书
      （深红色皮装封面，很好认）。对白只围绕"找门禁卡、取书"这一件事展开，
      不要提及会议、报告、辩论或其他人的委托。
    choices:
      - id: accept_book
        text: "我去阿皮斯实验室找门禁卡"
        actions: [{ type: flag.set, flag: astro_book_help }]
        stats: { empathy: 5 }
        outcome: "研究员连声道谢，把隔离区的位置和书的特征又仔细说了一遍。"
        outcome_speaker: astro_scientist_back
      - id: ask_where
        text: "书放在隔离区哪里？"
        stats: { curiosity: 5 }
        outcome: "研究员说书在隔离区东侧的书架上，深红色皮装封面，一眼就能认出来。"
        outcome_speaker: astro_scientist_back
      - id: ask_why_book
        text: "这本书为什么这么重要？"
        stats: { wisdom: 3 }
        outcome: "研究员说起哥白尼把地球从宇宙中心拉下来的故事，语气里带着敬意。"
        outcome_speaker: astro_scientist_back

  # ===== 索尔维会议主线 =====
  - id: dlg_solvay_lorentz_commission
    scene: solvay
    trigger: solvay_lorentz
    stage: prep
    pack: solvay
    minigame: archive-sort
    title: "洛伦兹的委托"
    atmosphere: "会议厅，会前忙碌，老派绅士的温和"
    characters: [su_ran, solvay_lorentz]
    prompt: "洛伦兹请你帮忙，你回应"
    description: |
      会议主席洛伦兹慈祥而疲惫，会议资料（座位安排表与科学家桌牌）散落在会场各处，
      他请你这个年轻的记录员帮忙找回。对白应透露"这是我最后一次主持了"的感伤伏笔，
      体现他作为新旧时代桥梁的温和公正。
    choices:
      - id: accept_commission
        text: "交给我吧，洛伦兹先生"
        actions: [{ type: flag.set, flag: lorentz_commission_accepted }]
        stats: { lorentz好感度: 15, empathy: 5 }
        outcome: "洛伦兹欣慰地笑了：「谢谢你，年轻人。会议可以顺利召开了。」"
        outcome_speaker: solvay_lorentz
      - id: ask_last_time
        text: "您说'最后一次'……是什么意思？"
        stats: { lorentz好感度: 10, wisdom: 5 }
        outcome: "洛伦兹沉默片刻，望向空荡的会议厅：「有些时代，是要有人目送它落幕的。」"
        outcome_speaker: solvay_lorentz

  - id: dlg_solvay_de_broglie
    scene: solvay
    trigger: solvay_de_broglie
    stage: debate1
    pack: solvay
    title: "从一个落点到一张图"
    atmosphere: "茶歇走廊，阵营分化，德布罗意的孤独"
    characters: [su_ran, solvay_de_broglie]
    prompt: "面对被两大阵营忽视的德布罗意，你选择"
    description: |
      你把电子衍射累积图拿给德布罗意：单个落点是粒子，整体图样却是波——这正是他的物质波。
      茶歇时人群已分成玻尔/海森堡的哥本哈根阵营与爱因斯坦/薛定谔的实在论阵营，
      德布罗意独自站在角落。对白应呈现"第三条道路"的优雅与脆弱，推进到选边或关心他的抉择。
    choices:
      - id: side_copenhagen
        text: "走向玻尔、海森堡那一组"
        actions: [{ type: flag.set, flag: camp_copenhagen }]
        stats: { copenhagen_affinity: 15, realism_affinity: -5 }
        outcome: "海森堡热情地拉你加入讨论，泡利打量你一眼；爱因斯坦在远处微微点头，目光却有一丝失望。"
